name: weathercrafter
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      # setuptools 81 removed pkg_resources, which diffsynth's setup.py imports.
      # Without this pin the synthesis install fails with ModuleNotFoundError.
      - setuptools<81
      # Pin the torch stack that works for BOTH Depth Anything 3 and VACE/diffsynth.
      # A bare `torch>=2` resolves to a newer build that breaks diffsynth, so we pin
      # torch 2.5.1 + cu124. Adjust the cu124 index below to match your CUDA.
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.5.1+cu124
      - torchvision==0.20.1+cu124
      # weathercrafter + vendored DA3. The `geometry` extra adds xformers/pycolmap,
      # which auto-match torch 2.5.1.
      - -e .[geometry]
      # The synthesis (VACE) stage needs diffsynth. Install it separately, after
      # the env exists -- see README. It must skip build isolation so its setup.py
      # can reach the pinned setuptools above, and that flag cannot be applied to
      # this package too (hatchling needs the isolated build env).
