[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "weathercrafter"
version = "0.1.0"
description = "Semantic-aware, physics-informed, geometry-grounded weather synthesis for video"
readme = "README.md"
requires-python = ">=3.10, <3.13"
license = { text = "Apache-2.0" }
keywords = ["weather-synthesis", "video-editing", "particle-simulation", "diffusion", "autonomous-driving"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Video",
]

# Runtime deps for preprocess + anchoring + simulation.
# The synthesis (VACE) stage needs `diffsynth`, installed separately -- see README.
dependencies = [
    "torch>=2",
    "torchvision",
    "einops",
    "safetensors",
    "huggingface_hub",
    "numpy<2",
    "opencv-python",
    "open3d",
    "trimesh",
    "plyfile",
    "imageio",
    "pillow",
    "noise",
    "matplotlib",
    "openai",
    "requests",
    "omegaconf",
]

[project.optional-dependencies]
# Vendored Depth Anything 3 pulls these in for point-map export / attention kernels.
geometry = ["xformers", "pycolmap"]
# The synthesis (VACE) stage. Pinned to a known-good commit: the PyPI release and
# this commit both report version 1.1.8, so an existing install is silently kept
# unless you add --force-reinstall. Needs --no-build-isolation (see README).
synthesis = [
    "diffsynth @ git+https://github.com/modelscope/DiffSynth-Studio.git@8332ece",
    "modelscope",
    "ftfy",
]

[project.scripts]
weathercrafter = "weathercrafter.cli:main"

[project.urls]
Homepage = "https://jumponthemoon.github.io/w-crafter/"
Repository = "https://github.com/Jumponthemoon/WeatherCrafter"

[tool.hatch.build.targets.wheel]
packages = ["weathercrafter", "src/depth_anything_3"]
