[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "weathercrafter"
version = "0.1.0"
description = "Semantic-aware, physics-informed, geometry-grounded weather synthesis for video"
readme = "README.md"
requires-python = ">=3.10, <3.13"
license = { text = "Apache-2.0" }
keywords = ["weather-synthesis", "video-editing", "particle-simulation", "diffusion", "autonomous-driving"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Video",
]

# Runtime deps for preprocess + anchoring + simulation.
# The synthesis (VACE) stage needs `diffsynth`, installed separately -- see README.
dependencies = [
    "torch>=2",
    "torchvision",
    # diffsynth (synthesis stage) breaks on transformers 5.x.
    "transformers<5",
    "einops",
    "safetensors",
    "huggingface_hub",
    "numpy<2",
    "opencv-python",
    "open3d",
    "trimesh",
    "plyfile",
    "imageio",
    "pillow",
    "noise",
    "matplotlib",
    "openai",
    "requests",
    "omegaconf",
    # Imported by the vendored Depth Anything 3: export/gs.py, utils/sh_helpers.py,
    # and utils/pose_align.py respectively. Pulled in by `depth_anything_3.api`.
    "moviepy==1.0.3",
    "e3nn",
    "evo",
]

[project.optional-dependencies]
# Vendored Depth Anything 3 pulls these in for point-map export / attention kernels.
geometry = ["xformers", "pycolmap"]
# Runtime deps of the synthesis stage other than diffsynth itself. diffsynth is
# NOT listed here: it must be installed with --no-build-isolation (its setup.py
# imports pkg_resources), and that flag cannot be applied to this package as well,
# because hatchling relies on the isolated build env. See README for the command.
synthesis = ["modelscope", "ftfy"]

[project.scripts]
weathercrafter = "weathercrafter.cli:main"

[project.urls]
Homepage = "https://jumponthemoon.github.io/w-crafter/"
Repository = "https://github.com/Jumponthemoon/WeatherCrafter"

[tool.hatch.build.targets.wheel]
packages = ["weathercrafter", "src/depth_anything_3"]

# The `synthesis` extra pins diffsynth to a git commit, which is a PEP 508 direct
# reference. Hatchling rejects those unless this is set -- and it validates every
# extra while generating metadata, so without it even `pip install -e .` fails.
[tool.hatch.metadata]
allow-direct-references = true
